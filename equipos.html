    }

    .equipo {

      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      max-width: 500px;
    }

    .equipo:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .jugadores {
      display: none;
      margin-top: 1rem;
      text-align: left;
    }

    .jugadores ul {
      list-style: none;
      padding-left: 1rem;
    }

    .jugadores li {

    }
